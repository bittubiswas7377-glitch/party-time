name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "$JAVA_HOME"

          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set." >&2
            exit 1
          fi

          RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $RAW_VERSION"

          if [ -z "$RAW_VERSION" ]; then
            echo "ERROR: Could not detect Java version string." >&2
            exit 1
          fi

          MAJOR_VERSION=$(echo "$RAW_VERSION" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $MAJOR_VERSION"

          if [ -z "$MAJOR_VERSION" ] || ! [ "$MAJOR_VERSION" -ge 0 ] 2>/dev/null; then
            echo "ERROR: Could not parse Java major version from '$RAW_VERSION'." >&2
            exit 1
          fi

          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Active Java major version is $MAJOR_VERSION, but 17 or newer is required." >&2
            exit 1
          fi

          echo "Java environment verified: major version $MAJOR_VERSION is >= 17."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Debug keystore already exists at $KEYSTORE_PATH. Skipping generation."
          else
            echo "Generating temporary debug keystore at $KEYSTORE_PATH..."
            "$JAVA_HOME/bin/keytool" -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000

            if [ ! -f "$KEYSTORE_PATH" ]; then
              echo "ERROR: Failed to create $KEYSTORE_PATH." >&2
              exit 1
            fi
            echo "Temporary debug keystore generated successfully."
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK." >&2
            echo "Discovered APK files in app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 4 -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK at $EXPECTED_APK is empty." >&2
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: $EXPECTED_APK does not have a .apk extension." >&2
              exit 1
              ;;
          esac

          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK" 2>/dev/null || wc -c < "$EXPECTED_APK")
          echo "Verified debug APK: $EXPECTED_APK (size: $APK_SIZE bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_RELEASE_DIR=$(mktemp -d -t partymap-release-XXXXXX)

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/^-*//;s/-*$//')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="android-app"
          fi

          RELEASE_FILENAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TARGET_FILE="${TEMP_RELEASE_DIR}/${RELEASE_FILENAME}"

          cp "$EXPECTED_APK" "$TARGET_FILE"

          if [ ! -f "$TARGET_FILE" ] || [ ! -s "$TARGET_FILE" ]; then
            echo "ERROR: Failed to prepare release asset at $TARGET_FILE." >&2
            exit 1
          fi

          echo "Release asset prepared: $TARGET_FILE"
          echo "asset_path=$TARGET_FILE" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI version ==="
          gh --version

          RELEASE_ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          RELEASE_ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "ERROR: Release asset $RELEASE_ASSET_PATH does not exist or is empty." >&2
            exit 1
          fi

          case "$RELEASE_ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset $RELEASE_ASSET_PATH is not an .apk file." >&2
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE=$(mktemp -t release-notes-XXXXXX.md)
          cat <<EOF > "$NOTES_FILE"
          ## PartyMap Debug APK

          This is an automatically generated debug APK built by GitHub Actions.

          - **Build Run Number:** #${GITHUB_RUN_NUMBER}
          - **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit:** ${GITHUB_SHA}
          - **Built By:** GitHub Actions
          - **Signing:** Temporary debug keystore (RSA 2048)
          - **Intended Purpose:** Testing & development preview on Android devices

          > **Note:** This APK is intended for testing and development preview. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF

          echo "Creating GitHub Release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            "$RELEASE_ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA" \
            --latest

          rm -f "$NOTES_FILE"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Succeeded ==="
            gh release view "$RELEASE_TAG" || true

            REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
            RELEASE_URL="${REPO_URL}/releases/tag/${RELEASE_TAG}"

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Direct Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
            ## :tada: Debug APK Build & Release Succeeded!

            - **Release Title:** ${RELEASE_TITLE}
            - **Release Tag:** \`${RELEASE_TAG}\`
            - **Direct Download:** [Download APK from GitHub Release](${RELEASE_URL})
            - **Asset Filename:** \`${ASSET_NAME}\`

            You can download the \`.apk\` file directly on your Android phone from the release **Assets** section.
            The normal GitHub Actions artifact named \`app-debug-apk\` is also preserved and available in the run summary as a backup.
            EOF
          else
            echo "::warning::GitHub Release publishing did not succeed, but the debug APK was built and uploaded successfully as an Actions artifact."
            echo "Actions artifact 'app-debug-apk' remains available for download."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
            ## :warning: Debug APK Build Succeeded (Release Warning)

            - **Build Status:** Succeeded
            - **Actions Artifact:** The debug APK was uploaded as an Actions artifact named \`app-debug-apk\`.
            - **Release Status:** GitHub Release publishing could not be completed, but your APK build was NOT lost and can be downloaded from the **Artifacts** section at the bottom of this Actions run page.
            EOF
          fi
